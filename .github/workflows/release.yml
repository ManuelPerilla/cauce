name: release-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.0)
        required: true
        default: 0.2.0
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } elseif ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            [xml]$props = Get-Content ./Directory.Build.props
            $version = [string]$props.Project.PropertyGroup.VersionPrefix
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Could not resolve a release version.'
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Build MSI and portable packages
        shell: pwsh
        run: ./build/release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Generate checksums and Windows bundle
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $releaseDir = Join-Path $PWD 'artifacts/release'
          $checksumFile = Join-Path $releaseDir 'SHA256SUMS.txt'

          Get-ChildItem $releaseDir -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content $checksumFile -Encoding ascii

          $bundle = Join-Path $PWD "artifacts/NgMusic-$version-Windows-Packages.zip"
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $bundle -CompressionLevel Optimal

      - name: Upload Actions package
        uses: actions/upload-artifact@v4
        with:
          name: NgMusic-${{ steps.version.outputs.version }}-Windows
          path: |
            artifacts/release/*
            artifacts/NgMusic-${{ steps.version.outputs.version }}-Windows-Packages.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $releaseDir = Join-Path $PWD 'artifacts/release'
          $bundle = Join-Path $PWD "artifacts/NgMusic-$version-Windows-Packages.zip"
          $assets = @(
            Get-ChildItem $releaseDir -File | ForEach-Object { $_.FullName }
          ) + @($bundle)

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            $notes = @"
NgMusic $version

First packaged Windows release.

Included:
- MSI installers for x64, ARM64 and x86
- Portable self-contained ZIPs for x64, ARM64 and x86
- Combined Windows package bundle
- SHA-256 checksums

The portable and installed editions use the same application payload. Google OAuth configuration is documented in the repository.
"@
            gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target '${{ github.sha }}' `
              --title "NgMusic v$version" `
              --notes $notes
          }
